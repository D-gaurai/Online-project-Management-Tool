<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Dashboard - GeForce</title>
    <link rel="stylesheet" href="css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="app-wrapper">
        <div id="navbar-container"></div>
        <div class="page-container">
            <div id="loadingState" class="loading-state"><div class="spinner"></div></div>
            <div id="dashboardContent" class="hidden">
                <div class="dashboard-top-row">
                    <div class="dashboard-banner">
                        <div class="banner-content">
                            <h1 id="welcomeGreeting">Dashboard</h1>
                            <p>Here is what's happening with your projects today.</p>
                        </div>
                        <img src="https://cdni.iconscout.com/illustration/premium/thumb/web-development-3454628-2918517.png" alt="Developer" class="banner-illustration">
                    </div>
                    <div class="calendar-widget stat-card">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <button id="prevMonth" class="btn btn-secondary btn-icon"><i class='bx bx-chevron-left'></i></button>
                            <h3 id="calendarMonth" style="margin: 0; font-size: 15px; color: var(--text-main); font-weight: 600;"></h3>
                            <button id="nextMonth" class="btn btn-secondary btn-icon"><i class='bx bx-chevron-right'></i></button>
                        </div>
                        <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 8px;">
                            <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                        </div>
                        <div id="calendarDays" style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: 13px;"></div>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card" onclick="window.location.href='projects.html'">
                        <div>
                            <div class="stat-label">Total Projects</div>
                            <div class="stat-value" id="totalProjects">0</div>
                        </div>
                        <div class="stat-icon bg-blue-light"><i class='bx bx-folder' style="color:#2563eb;"></i></div>
                    </div>
                    <div class="stat-card" onclick="window.location.href='projects.html?status=ACTIVE'">
                        <div>
                            <div class="stat-label">Active Projects</div>
                            <div class="stat-value" id="activeProjects">0</div>
                        </div>
                        <div class="stat-icon bg-orange-light"><i class='bx bx-play-circle' style="color:#d97706;"></i></div>
                    </div>
                    <div class="stat-card" onclick="window.location.href='projects.html?status=COMPLETED'">
                        <div>
                            <div class="stat-label">Completed Projects</div>
                            <div class="stat-value" id="completedProjects">0</div>
                        </div>
                        <div class="stat-icon bg-green-light"><i class='bx bx-check-circle' style="color:#16a34a;"></i></div>
                    </div>
                    <div class="stat-card" onclick="window.location.href='tasks.html'">
                        <div>
                            <div class="stat-label">My Total Tasks</div>
                            <div class="stat-value" id="totalTasks">0</div>
                        </div>
                        <div class="stat-icon bg-gray-light"><i class='bx bx-time-five' style="color:#6b7280;"></i></div>
                    </div>
                    <div class="stat-card" onclick="window.location.href='tasks.html?status=IN_PROGRESS'">
                        <div>
                            <div class="stat-label">My Pending Tasks</div>
                            <div class="stat-value" id="pendingTasks">0</div>
                        </div>
                        <div class="stat-icon bg-orange-light"><i class='bx bx-time-five' style="color:#d97706;"></i></div>
                    </div>
                    <div class="stat-card" onclick="window.location.href='tasks.html?status=COMPLETED'">
                        <div>
                            <div class="stat-label">My Completed Tasks</div>
                            <div class="stat-value" id="completedTasks">0</div>
                        </div>
                        <div class="stat-icon bg-gray-light"><i class='bx bx-check-double' style="color:#6b7280;"></i></div>
                    </div>
                </div>

                <div class="dashboard-bottom-row">
                    <div class="recent-activity-col">
                        <div class="section-title">Recent Activity</div>
                        <div id="activityList" class="card-list"></div>
                    </div>
                    <div class="deadlines-col">
                        <div class="section-title">Upcoming Deadlines (next 7 days)</div>
                        <div id="deadlineList" class="card-list"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script src="js/common.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
