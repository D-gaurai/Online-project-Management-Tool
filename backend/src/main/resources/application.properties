# ===== Application Info =====
spring.application.name=projectmanagement

# ===== Database Connection =====
spring.datasource.url=jdbc:mysql://localhost:3306/project_management
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# 'update' lets Hibernate auto-create/update tables from our Entity classes during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT Config =====
# Secret key used to sign JWT tokens - loaded from environment variable, never hardcoded
app.jwt.secret=${JWT_SECRET}
# Token validity: 24 hours (in milliseconds)
app.jwt.expiration-ms=86400000

# ===== Mail Config (used later for notification emails - Phase 15) =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== Server Port =====
server.port=8080
